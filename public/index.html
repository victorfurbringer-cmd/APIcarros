<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Carros</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { color: #333; }
        .section { margin-bottom: 30px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        form { margin-bottom: 20px; }
        input, button { margin: 5px; padding: 8px; }
        button { background-color: #4CAF50; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #45a049; }
    </style>
</head>
<body>
    <h1>Loja de Venda de Carros</h1>

    <div class="section">
        <h2>Carros</h2>
        <table id="carsTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Modelo</th>
                    <th>Ano</th>
                    <th>Preço</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <form id="carForm">
            <input type="text" id="carModel" placeholder="Modelo" required>
            <input type="number" id="carYear" placeholder="Ano" required>
            <input type="number" id="carPrice" placeholder="Preço" required>
            <button type="submit">Adicionar Carro</button>
        </form>
    </div>

    <div class="section">
        <h2>Clientes</h2>
        <table id="customersTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Email</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <form id="customerForm">
            <input type="text" id="customerName" placeholder="Nome" required>
            <input type="email" id="customerEmail" placeholder="Email" required>
            <button type="submit">Adicionar Cliente</button>
        </form>
    </div>

    <div class="section">
        <h2>Vendas</h2>
        <table id="salesTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>ID Carro</th>
                    <th>ID Cliente</th>
                    <th>Data</th>
                    <th>Preço</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <form id="saleForm">
            <input type="number" id="saleCarId" placeholder="ID Carro" required>
            <input type="number" id="saleCustomerId" placeholder="ID Cliente" required>
            <input type="date" id="saleDate" required>
            <input type="number" id="salePrice" placeholder="Preço" required>
            <button type="submit">Registrar Venda</button>
        </form>
    </div>

    <script>
        const apiUrl = 'http://localhost:3001';

        // Funções para Carros
        async function loadCars() {
            const response = await fetch(`${apiUrl}/cars`);
            const cars = await response.json();
            const tbody = document.querySelector('#carsTable tbody');
            tbody.innerHTML = '';
            cars.forEach(car => {
                tbody.innerHTML += `
                    <tr>
                        <td>${car.id}</td>
                        <td>${car.model}</td>
                        <td>${car.year}</td>
                        <td>${car.price}</td>
                        <td><button onclick="deleteCar(${car.id})">Excluir</button></td>
                    </tr>
                `;
            });
        }

        async function addCar(event) {
            event.preventDefault();
            const model = document.getElementById('carModel').value;
            const year = document.getElementById('carYear').value;
            const price = document.getElementById('carPrice').value;
            await fetch(`${apiUrl}/cars`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ model, year: parseInt(year), price: parseFloat(price) })
            });
            loadCars();
            document.getElementById('carForm').reset();
        }

        async function deleteCar(id) {
            await fetch(`${apiUrl}/cars/${id}`, { method: 'DELETE' });
            loadCars();
        }

        // Funções para Clientes
        async function loadCustomers() {
            const response = await fetch(`${apiUrl}/customers`);
            const customers = await response.json();
            const tbody = document.querySelector('#customersTable tbody');
            tbody.innerHTML = '';
            customers.forEach(customer => {
                tbody.innerHTML += `
                    <tr>
                        <td>${customer.id}</td>
                        <td>${customer.name}</td>
                        <td>${customer.email}</td>
                        <td><button onclick="deleteCustomer(${customer.id})">Excluir</button></td>
                    </tr>
                `;
            });
        }

        async function addCustomer(event) {
            event.preventDefault();
            const name = document.getElementById('customerName').value;
            const email = document.getElementById('customerEmail').value;
            await fetch(`${apiUrl}/customers`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email })
            });
            loadCustomers();
            document.getElementById('customerForm').reset();
        }

        async function deleteCustomer(id) {
            await fetch(`${apiUrl}/customers/${id}`, { method: 'DELETE' });
            loadCustomers();
        }

        // Funções para Vendas
        async function loadSales() {
            const response = await fetch(`${apiUrl}/sales`);
            const sales = await response.json();
            const tbody = document.querySelector('#salesTable tbody');
            tbody.innerHTML = '';
            sales.forEach(sale => {
                tbody.innerHTML += `
                    <tr>
                        <td>${sale.id}</td>
                        <td>${sale.carId}</td>
                        <td>${sale.customerId}</td>
                        <td>${sale.date}</td>
                        <td>${sale.price}</td>
                        <td><button onclick="deleteSale(${sale.id})">Excluir</button></td>
                    </tr>
                `;
            });
        }

        async function addSale(event) {
            event.preventDefault();
            const carId = document.getElementById('saleCarId').value;
            const customerId = document.getElementById('saleCustomerId').value;
            const date = document.getElementById('saleDate').value;
            const price = document.getElementById('salePrice').value;
            await fetch(`${apiUrl}/sales`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ carId: parseInt(carId), customerId: parseInt(customerId), date, price: parseFloat(price) })
            });
            loadSales();
            document.getElementById('saleForm').reset();
        }

        async function deleteSale(id) {
            await fetch(`${apiUrl}/sales/${id}`, { method: 'DELETE' });
            loadSales();
        }

        // Carregar dados ao iniciar
        window.onload = () => {
            loadCars();
            loadCustomers();
            loadSales();
        };

        // Eventos dos formulários
        document.getElementById('carForm').addEventListener('submit', addCar);
        document.getElementById('customerForm').addEventListener('submit', addCustomer);
        document.getElementById('saleForm').addEventListener('submit', addSale);
    </script>
</body>
</html>
